[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ovos-skill-icanhazdadjokes"
dynamic = ["version"]
description = "OVOS jokes skill plugin"
readme = "README.md"
license = {text = "Apache-2.0"}
authors = [
    {name = "JarbasAi", email = "jarbasai@mailfence.com"}
]
keywords = ["ovos", "skill", "plugin"]
dependencies = [
    "ovos-workshop>=8.0.0,<9.0.0",
    "ovos-utils>=0.0.38,<1.0.0"
]

[project.optional-dependencies]
test = [
    "ovoscope>=1.5.0,<2.0.0",
    "pytest>=7.0.0,<9",
    "pytest-timeout>=2.0.0",
    "ovos-padatious>=1.0.0,<2.0.0"
]

[project.urls]
Homepage = "https://github.com/OpenVoiceOS/ovos-skill-icanhazdadjokes"

[project.entry-points."ovos.plugin.skill"]
"ovos-skill-icanhazdadjokes.openvoiceos" = "ovos_skill_icanhazdadjokes:JokingSkill"

[tool.setuptools]
packages = ["ovos_skill_icanhazdadjokes"]

[tool.setuptools.package-dir]
ovos_skill_icanhazdadjokes = ""

[tool.setuptools.dynamic]
version = {attr = "ovos_skill_icanhazdadjokes.version.__version__"}

[tool.setuptools.package-data]
ovos_skill_icanhazdadjokes = [
    "*.json",
    "locale/**/*",
    "locale/*/*.voc",
    "locale/*/*.intent",
    "locale/*/*.dialog",
]
